services:
  postgres:
    image: postgres:16-alpine
    container_name: easycatalago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: easycatalago
      POSTGRES_PASSWORD: easycatalago
      POSTGRES_DB: easycatalago_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U easycatalago -d easycatalago_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: easycatalago_postgres_data
